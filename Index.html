<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <style>
    /* ========== RESET & BASE ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Animated background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
      animation: pulse 15s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    body.dark {
      background: #0f172a;
      color: #f1f5f9;
    }

    body.dark::before {
      background: 
        radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(96, 165, 250, 0.08) 0%, transparent 50%);
    }

    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 100px;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ========== HEADER ========== */
    .header {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 24px 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    body.dark .header {
      background: rgba(26, 31, 58, 0.95);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    body.light .header {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
      color: #2563eb;
      line-height: 1.4;
      flex: 1;
    }

    body.dark .header h1 {
      color: #60a5fa;
    }

    .theme-toggle {
      background: #2563eb;
      border: none;
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      background: #1d4ed8;
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    body.dark .theme-toggle {
      background: #3b82f6;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    body.dark .theme-toggle:hover {
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      background: #60a5fa;
    }

    .theme-toggle .material-icons-round {
      color: white;
      font-size: 24px;
    }

    .header-info {
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #userInfo {
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    body.dark #userInfo {
      color: #cbd5e0;
    }

    #dateLine {
      font-size: 13px;
      color: #718096;
      font-weight: 500;
    }

    body.dark #dateLine {
      color: #a0aec0;
    }

    .welcome-text {
      font-size: 15px;
      font-weight: 600;
      color: #2563eb;
      text-align: left;
    }

    body.dark .welcome-text {
      color: #60a5fa;
    }

    /* Store Switcher on Home Page */
    body.dark #storeSwitcher {
      background: rgba(59, 130, 246, 0.1) !important;
      border-color: rgba(59, 130, 246, 0.3) !important;
    }

    body.dark #storeSwitcher label {
      color: #60a5fa !important;
    }

    body.dark #storeSwitcher .material-icons-round {
      color: #60a5fa !important;
    }

    body.dark #storeSelect {
      background: rgba(45, 55, 72, 0.8) !important;
      border-color: rgba(59, 130, 246, 0.4) !important;
      color: #60a5fa !important;
    }

    body.dark #storeSelect:focus {
      border-color: #60a5fa !important;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15) !important;
    }

    /* ========== CARDS ========== */
    .card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1);
      animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    body.dark .card {
      background: rgba(26, 31, 58, 0.95);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    body.light .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== FORM ELEMENTS ========== */
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: #4a5568;
      margin-bottom: 10px;
      margin-top: 20px;
      letter-spacing: 0.3px;
    }

    label:first-of-type {
      margin-top: 0;
    }

    body.dark label {
      color: #cbd5e0;
    }

    input, select {
      width: 100%;
      padding: 16px 18px;
      border: 2px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(247, 250, 252, 0.8);
      color: #2d3748;
      font-weight: 500;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1), 0 4px 12px rgba(0, 0, 0, 0.1);
      transform: translateY(-1px);
    }

    body.dark input, body.dark select {
      background: rgba(45, 55, 72, 0.6);
      border-color: rgba(74, 85, 104, 0.6);
      color: #e2e8f0;
    }

    body.dark input:focus, body.dark select:focus {
      border-color: #60a5fa;
      background: rgba(45, 55, 72, 0.9);
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15), 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    input::placeholder {
      color: #a0aec0;
      font-weight: 400;
    }

    input:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ========== BUTTONS ========== */
    button {
      width: 100%;
      padding: 18px 24px;
      border-radius: 16px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Poppins', sans-serif;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.3px;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
    }

    .primary:hover:not(:disabled) {
      box-shadow: 0 12px 35px rgba(37, 99, 235, 0.4);
      transform: translateY(-2px);
      background: #1d4ed8;
    }

    body.dark .primary {
      background: #3b82f6;
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
    }

    body.dark .primary:hover:not(:disabled) {
      box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
      background: #60a5fa;
    }

    .secondary {
      background: rgba(247, 250, 252, 0.9);
      color: #4a5568;
      border: 2px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .secondary:hover:not(:disabled) {
      background: white;
      border-color: #cbd5e0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    body.dark .secondary {
      background: rgba(45, 55, 72, 0.7);
      color: #e2e8f0;
      border-color: rgba(74, 85, 104, 0.6);
    }

    body.dark .secondary:hover:not(:disabled) {
      background: rgba(55, 65, 81, 0.9);
      border-color: #718096;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .danger {
      background: #ef4444;
      color: white;
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
    }

    .danger:hover:not(:disabled) {
      box-shadow: 0 12px 35px rgba(239, 68, 68, 0.4);
      transform: translateY(-2px);
      background: #dc2626;
    }

    /* ========== TILE GRID ========== */
    .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .tile {
      background: rgba(37, 99, 235, 0.08);
      padding: 24px 16px;
      border-radius: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid rgba(37, 99, 235, 0.2);
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #2563eb;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .tile:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.25);
      border-color: #2563eb;
    }

    .tile:hover::before {
      opacity: 0.1;
    }

    body.dark .tile {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.2);
    }

    body.dark .tile::before {
      background: #3b82f6;
    }

    body.dark .tile:hover {
      border-color: #3b82f6;
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.25);
    }

    .tile .material-icons-round {
      font-size: 40px;
      color: #2563eb;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    body.dark .tile .material-icons-round {
      color: #60a5fa;
    }

    .tile-label {
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      position: relative;
      z-index: 1;
    }

    body.dark .tile-label {
      color: #e2e8f0;
    }

    /* ========== PRICE BOX ========== */
    .price-box {
      background: rgba(37, 99, 235, 0.08);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin: 20px 0;
      border: 2px solid rgba(37, 99, 235, 0.25);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.12);
    }

    body.dark .price-box {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.2);
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.1);
    }

    .price-box-label {
      font-size: 12px;
      font-weight: 700;
      color: #718096;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    body.dark .price-box-label {
      color: #a0aec0;
    }

    .price {
      font-size: 32px;
      font-weight: 700;
      color: #2563eb;
    }

    body.dark .price {
      color: #60a5fa;
    }

    .total {
      font-size: 36px;
      font-weight: 800;
      color: #2563eb;
    }

    body.dark .total {
      color: #60a5fa;
    }

    /* ========== SEARCH RESULTS ========== */
    #searchResults, #stockSearchResults {
      background: white;
      border: 2px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px;
      max-height: 250px;
      overflow-y: auto;
      margin-top: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    body.dark #searchResults, body.dark #stockSearchResults {
      background: rgba(45, 55, 72, 0.95);
      border-color: rgba(74, 85, 104, 0.6);
    }

    #searchResults > div, #stockSearchResults > div {
      padding: 16px 18px;
      cursor: pointer;
      border-bottom: 1px solid rgba(226, 232, 240, 0.5);
      transition: all 0.2s;
      font-size: 14px;
    }

    body.dark #searchResults > div, body.dark #stockSearchResults > div {
      border-bottom-color: rgba(74, 85, 104, 0.4);
    }

    #searchResults > div:last-child, #stockSearchResults > div:last-child {
      border-bottom: none;
    }

    #searchResults > div:hover, #stockSearchResults > div:hover {
      background: rgba(37, 99, 235, 0.08);
      padding-left: 24px;
    }

    body.dark #searchResults > div:hover, body.dark #stockSearchResults > div:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    /* ========== STOCK INFO ========== */
    #stockInfo {
      background: #dbeafe;
      color: #1e40af;
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 16px;
      border-left: 4px solid #2563eb;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.15);
    }

    body.dark #stockInfo {
      background: rgba(37, 99, 235, 0.15);
      color: #93c5fd;
      border-left-color: #60a5fa;
    }

    /* ========== MODAL ========== */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }

    .modal {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      max-height: 85vh;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      animation: modalSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body.dark .modal {
      background: rgba(26, 31, 58, 0.98);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .modal-content {
      padding: 28px 24px 0;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 0 24px 28px;
      background: white;
      border-top: 1px solid rgba(226, 232, 240, 0.3);
      padding-top: 20px;
      flex-shrink: 0;
    }

    body.dark .modal-footer {
      background: rgba(26, 31, 58, 0.98);
      border-top-color: rgba(74, 85, 104, 0.3);
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #2d3748;
    }

    body.dark .modal h3 {
      color: #e2e8f0;
    }

    .modal label {
      margin-top: 16px;
      font-size: 12px;
    }

    .modal label:first-of-type {
      margin-top: 0;
    }

    .modal input {
      padding: 12px 14px;
      font-size: 14px;
    }

    #modalText {
      font-size: 15px;
      color: #4a5568;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    body.dark #modalText {
      color: #cbd5e0;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    body.dark .modal-actions {
      background: transparent;
    }

    /* When showing result message, use flex instead of grid */
    .modal-actions.single-button {
      display: flex;
      flex-direction: column;
    }

    .modal-actions button {
      margin-top: 0;
      padding: 14px 20px;
      font-size: 14px;
      position: relative;
      z-index: 1;
    }

    /* Ensure primary button is always on top */
    .modal-actions button.primary {
      z-index: 2;
    }

    /* ========== UTILITY ========== */
    .hidden {
      display: none !important;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
      .wrapper {
        padding: 16px 12px 80px;
      }

      .header {
        padding: 24px 20px 20px;
        border-radius: 24px;
      }

      .header h1 {
        font-size: 17px;
      }

      .theme-toggle {
        width: 44px;
        height: 44px;
        min-width: 44px;
      }

      .card {
        padding: 24px 20px;
        border-radius: 24px;
      }

      .tiles {
        gap: 12px;
      }

      .tile {
        padding: 20px 12px;
        min-height: 110px;
      }

      .tile .material-icons-round {
        font-size: 36px;
      }

      .tile-label {
        font-size: 12px;
      }

      button {
        padding: 16px 20px;
        font-size: 14px;
      }

      input, select {
        padding: 14px 16px;
        font-size: 14px;
      }

      .price {
        font-size: 28px;
      }

      .total {
        font-size: 32px;
      }

      .modal {
        padding: 24px 20px;
        max-width: 340px;
        max-height: 80vh;
      }

      .modal h3 {
        font-size: 18px;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .wrapper {
        padding: 20px 16px 80px;
      }
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(241, 241, 241, 0.5);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2563eb;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #1d4ed8;
    }

    body.dark ::-webkit-scrollbar-track {
      background: rgba(45, 55, 72, 0.5);
    }

    body.dark ::-webkit-scrollbar-thumb {
      background: #3b82f6;
    }

    body.dark ::-webkit-scrollbar-thumb:hover {
      background: #60a5fa;
    }
  </style>
</head>

<body class="light">
<div class="wrapper">

  <div class="header">
    <div class="header-top">
      <h1>Heritage Jnr. Electronics & Furniture</h1>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span class="material-icons-round">brightness_6</span>
      </button>
    </div>
    <div class="header-info">
      <div id="userInfo" class="hidden"></div>
      <div id="welcomeMsg" class="welcome-text">Welcome! Please login to continue</div>
      <div id="dateLine"></div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="login">
    <label>Login Code</label>
    <input id="loginCode" type="password" placeholder="Enter your login code" autocomplete="off">
    <button class="primary" onclick="login()">
      <span class="material-icons-round" style="font-size: 20px;">login</span>
      Login
    </button>
  </div>

  <!-- HOME -->
  <div class="card hidden" id="home">
    <!-- ADMIN STORE SWITCHER -->
    <div id="storeSwitcher" class="hidden" style="margin-bottom: 20px; padding: 20px; background: rgba(37, 99, 235, 0.08); border-radius: 16px; border: 2px solid rgba(37, 99, 235, 0.2);">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <span class="material-icons-round" style="color: #2563eb; font-size: 24px;">store</span>
        <label style="margin: 0; font-size: 14px; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: 0.5px;">Current Store</label>
      </div>
      <select id="storeSelect" onchange="switchStore()" style="padding: 14px 16px; font-size: 15px; font-weight: 600; border-radius: 12px; border: 2px solid rgba(37, 99, 235, 0.3); background: white; color: #2563eb; cursor: pointer; width: 100%;">
        <option value="">Select Store</option>
      </select>
    </div>

    <div class="tiles" id="mainTiles">
      <div class="tile" onclick="show('sales')">
        <span class="material-icons-round">point_of_sale</span>

    <div id="stockInfo" style="display:none;"></div>

    <div class="price-box" style="margin-top: 20px;">

    <label>Payment Method</label>

      <option>Cash</option>
      <option>POS</option>
      <option>Transfer</option>

    <button class="primary" onclick="confirmSale(this)">
      <span class="material-icons-round" style="font-size: 20px;">shopping_cart</span>
      Record Sale
    </button>
    <button class="secondary" onclick="confirmUndo(this)">
      <span class="material-icons-round" style="font-size: 20px;">undo</span>
      Undo Last Sale
    </button>
    <button class="secondary" onclick="openNewProduct()">
      <span class="material-icons-round" style="font-size: 20px;">add_circle</span>
      Sell New Product
    </button>
    <button class="secondary" onclick="show('home')">
      <span class="material-icons-round" style="font-size: 20px;">home</span>

    </button>
  </div>

  <!-- STOCK -->
  <div class="card hidden" id="stock">
    <label>Transaction Date</label>
    <input type="date" id="stockDate">

    <label>Search Product</label>
    <input id="stockSearch" placeholder="Type product name..." oninput="searchStockProducts()">
    <div id="stockSearchResults" class="hidden"></div>

    <label>Category</label>
    <select id="stockCategory" onchange="onStockCategory()"></select>

    <label>SubCategory</label>
    <select id="stockSubCategory" onchange="onStockSub()" disabled></select>

    <label>Product</label>
    <select id="stockProduct" disabled></select>

    <label>Quantity</label>
    <input id="stockQty" type="number" min="1" placeholder="Enter quantity">

    <button class="primary" onclick="confirmStock()">
      <span class="material-icons-round" style="font-size: 20px;">add_box</span>
      Add Stock
    </button>
    <button class="secondary" onclick="show('home')">
      <span class="material-icons-round" style="font-size: 20px;">home</span>
      Back to Home
    </button>
  </div>

  <!-- EXPENSE -->
  <div class="card hidden" id="expense">
    <label>Transaction Date</label>
    <input type="date" id="expenseDate">

    <label>Expense Type</label>
    <select id="expenseType"></select>

    <label>Amount</label>
    <input id="expenseAmount" type="number" min="0" placeholder="Enter amount">
    
    <label>Notes (Optional)</label>
    <input id="expenseNotes" placeholder="Add notes...">
    
    <button class="primary" onclick="confirmExpense()">
      <span class="material-icons-round" style="font-size: 20px;">receipt</span>
      Record Expense
    </button>
    <button class="secondary" onclick="openNewExpense()">
      <span class="material-icons-round" style="font-size: 20px;">add_circle</span>
      Record New Expense Type
    </button>
    <button class="secondary" onclick="show('home')">
      <span class="material-icons-round" style="font-size: 20px;">home</span>
      Back to Home
    </button>

      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
</div>

<!-- NEW PRODUCT MODAL -->
<div class="modal-bg" id="newProductModal">
  <div class="modal">
    <div class="modal-content">
      <h3>Sell New Product</h3>

      <label>Product Name</label>
      <input id="newName" placeholder="Enter product name">

      <label>Category</label>
      <input id="newCategory" placeholder="e.g., Electronics">

      <label>SubCategory</label>
      <input id="newSubCategory" placeholder="e.g., Phones">

      <label>Initial Stock</label>
      <input id="newStock" type="number" min="0" placeholder="0">

      <label>Selling Price</label>
      <input id="newPrice" type="number" min="0" placeholder="0">

      <label>Quantity to Sell</label>
      <input id="newQty" type="number" value="1" min="1">

<div class="modal-bg" id="newExpenseModal">
  <div class="modal">
    <div class="modal-content">
      <h3>Record New Expense</h3>

      <label>Expense Type</label>
      <input id="newExpenseType" placeholder="e.g., Office Supplies">

      <label>Amount</label>
      <input id="newExpenseAmount" type="number" min="0" placeholder="0">

      <label>Notes (Optional)</label>
      <input id="newExpenseNotes" placeholder="Add notes...">

    <div class="modal-footer">
      <div class="modal-actions">
        <button class="secondary" onclick="closeNewExpense()">Cancel</button>
        <button class="primary" onclick="confirmNewExpense()">Record</button>
      </div>
    </div>

<script>
let user={},products=[],current=null;
const el=id=>document.getElementById(id);

function searchStockProducts(){
  const q = el("stockSearch").value.toLowerCase().trim();
  const box = el("stockSearchResults");
  box.innerHTML = "";

  if(!q){
    box.classList.add("hidden");
    return;
  }

  const matches = products.filter(p =>
    p.name.toLowerCase().includes(q)
  ).slice(0,20);

  if(matches.length === 0){
    box.innerHTML = "<div style='padding:16px;text-align:center;color:#a0aec0;'>No products found</div>";
  } else {
    matches.forEach(p=>{
      const d = document.createElement("div");
      d.innerHTML = `<strong>${p.name}</strong><br><small style="color:#718096;">Stock: ${p.stock}</small>`;
      d.onclick = () => selectStockProduct(p);
      box.appendChild(d);
    });
  }

  box.classList.remove("hidden");
}

function selectStockProduct(p){
  el("stockCategory").value = p.category;
  onStockCategory();

  setTimeout(()=>{
    el("stockSubCategory").value = p.subCategory;
    onStockSub();

    setTimeout(()=>{
      el("stockProduct").value = String(p.id);
    },50);
  },50);

  el("stockSearchResults").classList.add("hidden");
  el("stockSearch").value = "";
}

function searchProducts(){
  const q = el("searchProduct").value.toLowerCase().trim();
  const box = el("searchResults");
  box.innerHTML = "";

  if(!q){
    box.classList.add("hidden");
    return;
  }

  const matches = products.filter(p =>
    p.name.toLowerCase().includes(q)
  ).slice(0,20);

  if(matches.length === 0){
    box.innerHTML = "<div style='padding:16px;text-align:center;color:#a0aec0;'>No products found</div>";
  }else{
    matches.forEach(p=>{
      const d = document.createElement("div");
      d.innerHTML = `<strong>${p.name}</strong><br><small style="color:#718096;">Stock: ${p.stock} | Price: ₦${p.price.toLocaleString()}</small>`;
      d.onclick = () => selectProductFromSearch(p);
      box.appendChild(d);
    });
  }

  box.classList.remove("hidden");
}

function selectProductFromSearch(p){
  current = p;

  el("category").value = p.category;
  onCategory();

  setTimeout(()=>{
    el("subCategory").value = p.subCategory;
    onSub();

    setTimeout(()=>{
      el("product").value = String(p.id);
      loadProduct();
    },50);
  },50);

  el("searchResults").classList.add("hidden");
  el("searchProduct").value = "";
}

(function(){
  const d=new Date();
  el("dateLine").innerText=d.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  ["saleDate","stockDate","expenseDate"].forEach(id=>{
    const e=document.getElementById(id);
    if(e)e.value=new Date().toISOString().split("T")[0];
  });
})();

function toggleTheme(){
  const body = document.body;
  if(body.classList.contains('dark')){
    body.classList.remove('dark');
    body.classList.add('light');
  } else {
    body.classList.remove('light');
    body.classList.add('dark');
  }
}

function show(id){
  ["login","home","sales","stock","expense"].forEach(x=>el(x).classList.add("hidden"));
  el(id).classList.remove("hidden");
  
  // Reset sales form when showing sales page
  if(id === 'sales'){
    resetSales();
  }
  
  // Scroll to top when changing pages
  window.scrollTo(0, 0);
}

function modal(text,actions=[]){
  el("modalText").innerText=text;
  const a=el("modalActions");
  a.innerHTML="";
  
  // Add single-button class if only one action
  if(actions.length === 1) {
    a.classList.add("single-button");
  } else {
    a.classList.remove("single-button");
  }
  
  actions.forEach(b=>a.appendChild(b));
  el("modal").style.display="flex";
  // Prevent body scroll when modal is open
  document.body.style.overflow = "hidden";
}

function closeModal(){
  el("modal").style.display="none";
  // Restore body scroll
  document.body.style.overflow = "auto";
}

function login(){
  const code = el("loginCode").value.trim();
  if(!code) {
    modal("Please enter your login code", [btn("OK", closeModal)]);
    return;
  }

  modal("Logging in...");
  google.script.run.withSuccessHandler(u=>{
    closeModal();
    if(!u)return modal("Invalid login code. Please try again.",[btn("OK",closeModal)]);
    user=u;
    
    // Show user info, hide welcome message
    el("userInfo").innerHTML = `<span class="material-icons-round" style="font-size:16px;">person</span>${u.name} | ${u.store}`;
    el("userInfo").classList.remove("hidden");
    el("welcomeMsg").classList.add("hidden");
    
    // Show admin section if user is admin
    if(u.role && u.role.toLowerCase() === "admin") {
      el("adminSection").classList.remove("hidden");
      
      // Show store switcher for admin
      if(u.availableStores && u.availableStores.length > 1){
        const select = el("storeSelect");
        select.innerHTML = '<option value="">Switch Store</option>';
        u.availableStores.forEach(store => {
          const option = new Option(store, store);
          if(store === u.store) {
            option.text = store + " (Current)";
            option.selected = true;
          }
          select.add(option);
        });
        el("storeSwitcher").classList.remove("hidden");
      }
    } else {
      el("adminSection").classList.add("hidden");
      el("storeSwitcher").classList.add("hidden");
    }
    
    show("home");
    loadProducts();
    loadExpenseTypes();
    el("loginCode").value = "";
  }).checkCode(code);
}

function loadProducts(){
  google.script.run.withSuccessHandler(p=>{
    products = p;

    if(el("category")){
      el("category").innerHTML = '<option value="">Select Category</option>';
      el("subCategory").innerHTML = '<option value="">Select SubCategory</option>';
      el("product").innerHTML = '<option value="">Select Product</option>';
      el("subCategory").disabled = true;
      el("product").disabled = true;

      [...new Set(p.map(x=>x.category))]
        .forEach(v => el("category").add(new Option(v, v)));
    }

    if(el("stockCategory")){
      el("stockCategory").innerHTML = '<option value="">Select Category</option>';
      el("stockSubCategory").innerHTML = '<option value="">Select SubCategory</option>';
      el("stockProduct").innerHTML = '<option value="">Select Product</option>';
      el("stockSubCategory").disabled = true;
      el("stockProduct").disabled = true;

      [...new Set(p.map(x=>x.category))]
        .forEach(v => el("stockCategory").add(new Option(v, v)));
    }
  }).getProducts(user.store);
}

function loadExpenseTypes(){
  google.script.run.withSuccessHandler(t=>{
    const select = el("expenseType");
    select.innerHTML = '<option value="">Select Expense Type</option>';
    t.forEach(x => {
      select.add(new Option(x, x));
    });
  }).getExpenseTypes();
}

function onCategory(){
  el("subCategory").disabled = false;
  el("subCategory").innerHTML = '<option value="">Select SubCategory</option>';
  el("product").innerHTML = '<option value="">Select Product</option>';
  el("product").disabled = true;

  products
    .filter(p => p.category === el("category").value)
    .map(p => p.subCategory)
    .filter((v,i,a)=>a.indexOf(v)===i)
    .forEach(v => el("subCategory").add(new Option(v, v)));
}

function onSub(){
  el("product").disabled = false;
  el("product").innerHTML = '<option value="">Select Product</option>';

  products
    .filter(p => p.subCategory === el("subCategory").value)
    .forEach(p => el("product").add(new Option(p.name, p.id)));
}

function loadProduct(){
  current=products.find(p=>p.id===el("product").value);
  if(!current) return;
  
  el("price").innerText=current.price.toLocaleString();
  el("stockInfo").innerText="Available Stock: "+current.stock;
  el("stockInfo").style.display = "block";
  el("altPrice").value = current.price;
  calcTotal();
}

function calcTotal(){
  if(!current)return;
  const unit=Number(el("altPrice").value||current.price);
  el("total").innerText=(unit*Number(el("qty").value)).toLocaleString();
}

function resetSales(){
  el("category").value="";
  el("subCategory").innerHTML='<option value="">Select SubCategory</option>';
  el("product").innerHTML='<option value="">Select Product</option>';
  el("subCategory").disabled = true;
  el("product").disabled = true;
  el("price").innerText="0";
  el("altPrice").value="";
  el("qty").value=1;
  el("total").innerText="0";
  el("stockInfo").style.display="none";
  el("searchProduct").value = "";
  current=null;
}

function btn(text, fn, danger=false){
  const b = document.createElement("button");
  b.className = danger ? "danger" : "primary";
  b.innerText = text;
  b.onclick = fn;
  return b;
}

function confirmSale(confirmbtn){
  if(!current) return modal("Please select a product first", [btn("OK", closeModal)]);
  if(!el("qty").value || el("qty").value < 1) return modal("Please enter a valid quantity", [btn("OK", closeModal)]);
  
  modal("Confirm this sale?", [
    btn("Cancel", closeModal),
    btn("Confirm", () => {
      closeModal();
      processSale(confirmbtn);
    })
  ]);
}

function processSale(confirmbtn){
  confirmbtn.disabled = true;
  modal("Recording sale...");

  google.script.run.withSuccessHandler(r => {
    closeModal();
    confirmbtn.disabled = false;
    modal(r.msg, [btn("OK", () => { closeModal(); resetSales(); loadProducts(); })]);
  }).withFailureHandler(err => {
    closeModal();
    confirmbtn.disabled = false;
    modal("Error: " + err.message, [btn("OK", closeModal)]);
  }).recordSale({
    productID: current.id,
    qty: Number(el("qty").value),
    unitSoldPrice: Number(el("altPrice").value || current.price),
    payment: el("payment").value,
    soldBy: user.name,
    store: user.store,
    date: el("saleDate").value
  });
}

function confirmUndo(){
  modal("Undo your last sale?", [
    btn("Cancel", closeModal),
    btn("Undo", () => {
      closeModal();
      modal("Undoing sale...");

      google.script.run
        .withSuccessHandler(r => {
          closeModal();
          modal(r.msg || "Sale undone successfully", [btn("OK", () => {
            closeModal();
            loadProducts();
            resetSales();
          })]);
        })
        .withFailureHandler(err => {
          closeModal();
          modal("Error: " + err.message, [btn("OK", closeModal)]);
        })
        .undoLastSale(user.store, user.name);
    }, true)
  ]);
}

function confirmNewSale(){
  if(!el("newName").value){
    return modal("Please enter product name",[btn("OK",closeModal)]);
  }
  if(!el("newStock").value || !el("newPrice").value){
    return modal("Please fill all required fields",[btn("OK",closeModal)]);
  }

  modal("Create product and record sale?",[
    btn("Cancel",closeModal),
    btn("Confirm",()=>{
      closeModal();
      
      // CLOSE THE NEW PRODUCT MODAL FIRST
      closeNewProduct();
      
      modal("Creating product and recording sale...");

      google.script.run.withSuccessHandler(r=>{
        closeModal();
        modal(r.msg,[btn("OK",()=>{
          closeModal();
          resetSales();
          loadProducts();
        })]);
      }).withFailureHandler(err => {
        closeModal();
        modal("Error: " + err.message, [btn("OK", closeModal)]);
      }).sellNewProduct({
        productName:el("newName").value,
        category:el("newCategory").value,
        subCategory:el("newSubCategory").value,
        initialStock:+el("newStock").value,
        qty:+el("newQty").value,
        unitSoldPrice:+el("newPrice").value,
        payment:el("payment").value,
        soldBy:user.name,
        store:user.store,
        date:el("saleDate").value
      });
    })
  ]);
}

function confirmStock(){
  if(!el("stockProduct").value){
    return modal("Please select a product", [btn("OK", closeModal)]);
  }
  if(!el("stockQty").value || el("stockQty").value < 1){
    return modal("Please enter a valid quantity", [btn("OK", closeModal)]);
  }

  modal("Confirm stock addition?",[
    btn("Cancel",closeModal),
    btn("Confirm",()=>{
      closeModal();
      modal("Updating stock...");
      google.script.run.withSuccessHandler(r=>{
        closeModal();
        modal(r.msg,[btn("OK",()=>{
          closeModal();
          el("stockQty").value="";
          el("stockSearch").value="";
          loadProducts();
        })]);
      }).withFailureHandler(err => {
        closeModal();
        modal("Error: " + err.message, [btn("OK", closeModal)]);
      }).stockIn({
        productID:el("stockProduct").value,
        qty:+el("stockQty").value,
        store:user.store,
        performedBy:user.name,
        date:el("stockDate").value
      });
    })
  ]);
}

function confirmExpense(){
  const typeInput = el("expenseType").value.trim();
  const amount = +el("expenseAmount").value;

  if(!typeInput || !amount){
    return modal("Please select expense type and enter amount", [btn("OK", closeModal)]);
  }

  modal("Recording expense...");
  
  google.script.run.withSuccessHandler(res => {
    closeModal();
    modal(res.msg + " | ID: " + (res.id || "N/A"), [
      btn("OK", () => {
        closeModal();
        el("expenseType").value = "";
        el("expenseAmount").value = "";
        el("expenseNotes").value = "";
      })
    ]);
  }).withFailureHandler(err => {
    closeModal();
    modal("Error: " + err.message, [btn("OK", closeModal)]);
  }).recordExpense({
    expenseType: typeInput,
    amount,
    notes: el("expenseNotes").value,
    paidBy: user.name,
    store: user.store,
    date: el("expenseDate").value
  });
}

function openNewProduct(){
  el("newProductModal").style.display = "flex";
  document.body.style.overflow = "hidden";
}

function closeNewProduct(){
  el("newProductModal").style.display = "none";
  document.body.style.overflow = "auto";
  el("newName").value = "";
  el("newCategory").value = "";
  el("newSubCategory").value = "";
  el("newStock").value = "";
  el("newPrice").value = "";
  el("newQty").value = "1";
}

function openNewExpense(){
  el("newExpenseModal").style.display = "flex";
  document.body.style.overflow = "hidden";
}

function closeNewExpense(){
  el("newExpenseModal").style.display = "none";
  document.body.style.overflow = "auto";
  el("newExpenseType").value = "";
  el("newExpenseAmount").value = "";
  el("newExpenseNotes").value = "";
}

function confirmNewExpense(){
  const expenseType = el("newExpenseType").value.trim();
  const amount = +el("newExpenseAmount").value;

  if(!expenseType || !amount){
    return modal("Please fill all required fields", [btn("OK", closeModal)]);
  }

  // CLOSE THE MODAL FIRST before showing progress
  closeNewExpense();
  
  modal("Creating expense type...");

  google.script.run.withSuccessHandler(r => {
    
    modal("Recording expense...");
    
    google.script.run.withSuccessHandler(res => {
      closeModal();
      modal(res.msg + " | ID: " + (res.id || "N/A"), [
        btn("OK", () => {
          closeModal();
          loadExpenseTypes();
        })
      ]);
    }).withFailureHandler(err => {
      closeModal();
      modal("Error: " + err.message, [btn("OK", closeModal)]);
    }).recordExpense({
      expenseType: expenseType,
      amount: amount,
      notes: el("newExpenseNotes").value,
      paidBy: user.name,
      store: user.store,
      date: el("expenseDate").value
    });
    
  }).withFailureHandler(err => {
    closeModal();
    modal("Error: " + err.message, [btn("OK", closeModal)]);
  }).createExpenseType(expenseType);
}

function logout(){
  modal("Logging out...", []);

  setTimeout(() => {
    user = {};
    products = [];
    current = null;

    // Hide user info, show welcome message
    el("userInfo").classList.add("hidden");
    el("welcomeMsg").classList.remove("hidden");
    
    // Hide admin sections
    el("adminSection").classList.add("hidden");
    el("storeSwitcher").classList.add("hidden");

    el("loginCode").value = "";
    show("login");
    closeModal();
  }, 700);
}

function onStockCategory(){
  el("stockSubCategory").disabled=false;
  el("stockSubCategory").innerHTML='<option value="">Select SubCategory</option>';
  el("stockProduct").innerHTML='<option value="">Select Product</option>';
  el("stockProduct").disabled=true;

  products.filter(p=>p.category===el("stockCategory").value)
    .map(p=>p.subCategory)
    .filter((v,i,a)=>a.indexOf(v)===i)
    .forEach(v=>el("stockSubCategory").add(new Option(v,v)));
}

function onStockSub(){
  el("stockProduct").disabled=false;
  el("stockProduct").innerHTML='<option value="">Select Product</option>';

  products.filter(p=>p.subCategory===el("stockSubCategory").value)
    .forEach(p=>el("stockProduct").add(new Option(p.name,p.id)));
}

// Admin functions to open dashboard and records
function openDashboard() {
  window.open("https://app.powerbi.com/links/WRuF3rgK8m?ctid=e72c85fc-1aa8-4ed2-a88a-99b46e6af318&pbi_source=linkShare", "_blank");
}

function openRecords() {
  window.open("https://docs.google.com/spreadsheets/d/1NGtX_AxZ4er-EV5y4vDmyMpZZ6w8nXpkfxcOywSJK4A/edit?gid=1534263855#gid=1534263855", "_blank");
}

// Switch Store (Admin only)
function switchStore(){
  const newStore = el("storeSelect").value;
  
  if(!newStore || newStore === user.store) {
    return;
  }
  
  modal("Switching to " + newStore + "...", []);
  
  // Update user object
  user.store = newStore;
  
  // Update UI
  el("userInfo").innerHTML = `<span class="material-icons-round" style="font-size:16px;">person</span>${user.name} | ${user.store}`;
  
  // Update store select to show current
  const select = el("storeSelect");
  for(let i = 0; i < select.options.length; i++){
    if(select.options[i].value === newStore){
      select.options[i].text = newStore + " (Current)";
    } else if(select.options[i].value !== ""){
      select.options[i].text = select.options[i].value;
    }
  }
  
  // Reload products for new store
  loadProducts();
  
  // Reset forms
  resetSales();
  
  setTimeout(() => {
    closeModal();
    modal("Now viewing: " + newStore, [btn("OK", closeModal)]);
  }, 500);
}

</script>
